name: kirby-compatibility-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [compat/yoshi-build150]
    paths:
      - 'src/**'
      - 'tools/windows/**'
      - '.github/workflows/compatibility-windows.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-clang-cl:
    name: Windows compatibility build and tests
    runs-on: windows-2022
    timeout-minutes: 120
    # ccache rather than sccache: sccache has no direct mode for clang-cl, so every hit still ran the
    # preprocessor and a 99% hit build took 8.5 minutes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.44'
          sdk: '10.0.26100.0'

      # The release job's compiler; ThinLTO is left to the release build to keep this job short.
      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify compiler and SDK identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clang = & "$env:LLVM_ROOT/bin/clang-cl.exe" --version
          if ($LASTEXITCODE -ne 0 -or "$clang" -notmatch 'clang version 22\.1\.8\b') { throw 'Unexpected clang-cl' }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne '10.0.26100.0') { throw 'Unexpected Windows SDK' }
          if ($env:VCToolsVersion -notlike '14.44.*') { throw 'Unexpected MSVC toolset' }
          if ($env:VULKAN_SDK.Replace('\', '/').TrimEnd('/') -ne 'C:/VulkanSDK/1.4.341.1') { throw 'Unexpected Vulkan SDK' }
          $spirv = & "$env:VULKAN_SDK/Bin/spirv-val.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK validator does not run' }
          $qt = & qmake -query QT_VERSION
          if ($LASTEXITCODE -ne 0 -or $qt -ne '6.8.3') { throw 'Unexpected Qt version' }
          New-Item -ItemType Directory -Path build -Force | Out-Null
          @{clang = $clang; windows_sdk = $env:WindowsSDKVersion; msvc = $env:VCToolsVersion;
            vulkan_sdk = $env:VULKAN_SDK; spirv_validator = $spirv; qt = $qt; lto = $false} |
            ConvertTo-Json -Depth 4 | Set-Content build/compatibility-toolchain.json

      # Restore and save separately so a test failure still keeps the compiled objects.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
            clang-cl-ccache-qt683-${{ runner.os }}-

      - name: Configure production and tests
        env:
          MSYS2_ARG_CONV_EXCL: '-DCMAKE_EXE_LINKER_FLAGS='
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG"
          -DENABLE_DEBUG_TOOLS=ON -DENABLE_WERROR=ON
          -DENABLE_LTO=OFF
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DBUILD_TESTING=ON
          -DYUZU_TESTS=ON
          -DENABLE_QT=ON
          -DENABLE_QT_TRANSLATION=ON
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call.
      - name: Build provisional runtime and replay tools
        id: provisional_compile
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          cmake --build build --target yuzu yuzu-cmd shader-sweep --parallel

      - name: Report provisional compiler cache statistics
        if: always() && steps.provisional_compile.outcome != 'skipped'
        run: |
          mkdir -p build/compatibility-metrics
          ccache --print-stats --format=json > build/compatibility-metrics/provisional-ccache.json
          ccache --show-stats -v | tee build/compatibility-metrics/provisional-ccache.txt

      - name: Package PROVISIONAL runtime
        id: provisional_package
        if: always() && steps.provisional_compile.outcome == 'success'
        shell: pwsh
        run: |
          windeployqt --release --no-translations build/bin/lichii.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item -LiteralPath "$env:VULKAN_SDK/Bin/spirv-val.exe" -Destination build/bin/
          if (-not (Test-Path -LiteralPath build/bin/lichii.pdb)) { throw 'Diagnostic runtime PDB is missing' }
          ./tools/windows/write-compatibility-provenance.ps1 -Stage provisional

      - name: Upload PROVISIONAL Windows package
        if: always() && steps.provisional_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lichii-kirby-windows-PROVISIONAL-${{ github.sha }}-${{ github.run_attempt }}
          path: build/bin/
          retention-days: 14
          if-no-files-found: error

      - name: Build ALL milestone targets
        id: full_compile
        if: always() && steps.provisional_compile.outcome == 'success'
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          cmake --build build --parallel

      - name: Report full-build compiler cache statistics
        if: always() && steps.full_compile.outcome != 'skipped'
        run: |
          mkdir -p build/compatibility-metrics
          ccache --print-stats --format=json > build/compatibility-metrics/full-ccache.json
          ccache --show-stats -v | tee build/compatibility-metrics/full-ccache.txt

      # Windows may refuse to load the unsigned nxformat.dll (Smart App Control, code integrity
      # policies), so lichii.exe must not import it at startup: only a delay import is allowed.
      - name: Check nxformat.dll is delay-loaded
        id: imports
        if: always() && steps.full_compile.outcome == 'success'
        run: |
          imports=$("$LLVM_ROOT/bin/llvm-readobj" --coff-imports build/bin/lichii.exe |
            awk '/^(Import|DelayImport) {/ { kind = $1 } /^  Name:/ { print kind, $2 }')
          echo "$imports"
          if grep -qix 'Import nxformat.dll' <<< "$imports"; then
            echo "::error::lichii.exe imports nxformat.dll at startup; it must be delay-loaded"
            exit 1
          fi

      - name: Run tests
        id: tests
        if: always() && steps.full_compile.outcome == 'success'
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          --parallel "$NUMBER_OF_PROCESSORS"
          --output-junit "$GITHUB_WORKSPACE/build/compatibility-tests.xml"

      - name: Mark runtime VALIDATED
        id: validated_package
        if: always() && steps.full_compile.outcome == 'success' && steps.imports.outcome == 'success' && steps.tests.outcome == 'success' && steps.provisional_package.outcome == 'success'
        shell: pwsh
        run: ./tools/windows/write-compatibility-provenance.ps1 -Stage validated

      - name: Upload VALIDATED Windows package
        if: always() && steps.validated_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lichii-kirby-windows-VALIDATED-${{ github.sha }}-${{ github.run_attempt }}
          path: build/bin/
          retention-days: 14
          if-no-files-found: error

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/Testing/
            build/compatibility-tests.xml
            build/compatibility-metrics/
            build/compatibility-toolchain.json
          retention-days: 14
