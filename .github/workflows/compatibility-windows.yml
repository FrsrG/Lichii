name: compatibility-windows

on:
  workflow_dispatch:
  push:
    branches: [compat/yoshi-build150]
    paths:
      - 'src/**'
      - '.github/workflows/compatibility-windows.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-clang-cl:
    name: Windows compatibility build and tests
    runs-on: windows-2022
    timeout-minutes: 120
    # ccache rather than sccache: sccache has no direct mode for clang-cl, so every hit still ran the
    # preprocessor and a 99% hit build took 8.5 minutes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # The release job's compiler; ThinLTO is left to the release build to keep this job short.
      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      # Restore and save separately so a test failure still keeps the compiled objects.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl-ccache-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          -DENABLE_DEBUG_TOOLS=ON -DENABLE_WERROR=ON
          -DBUILD_TESTING=ON
          -DYUZU_TESTS=ON
          -DENABLE_QT=ON
          -DENABLE_QT_TRANSLATION=ON
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call.
      - name: Build production and tests
        id: compile
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats -v

      # Windows may refuse to load the unsigned nxformat.dll (Smart App Control, code integrity
      # policies), so lichii.exe must not import it at startup: only a delay import is allowed.
      - name: Check nxformat.dll is delay-loaded
        run: |
          imports=$("$LLVM_ROOT/bin/llvm-readobj" --coff-imports build/bin/lichii.exe |
            awk '/^(Import|DelayImport) {/ { kind = $1 } /^  Name:/ { print kind, $2 }')
          echo "$imports"
          if grep -qix 'Import nxformat.dll' <<< "$imports"; then
            echo "::error::lichii.exe imports nxformat.dll at startup; it must be delay-loaded"
            exit 1
          fi

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$NUMBER_OF_PROCESSORS"

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}

      - name: Package local test build
        id: package
        if: always() && steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          windeployqt --release --no-translations build/bin/lichii.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item -LiteralPath "$env:VULKAN_SDK/Bin/spirv-val.exe" -Destination build/bin/
          git rev-parse HEAD | Set-Content build/bin/SOURCE_COMMIT.txt
          "Build 150 derivative for compatibility validation; gameplay unverified." |
            Set-Content build/bin/COMPATIBILITY_BUILD.txt

      - name: Upload Windows test package
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lichii-build150-yoshi-windows-${{ github.sha }}
          path: build/bin/
          retention-days: 14
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-test-results-${{ github.sha }}
          path: build/Testing/
          retention-days: 14
